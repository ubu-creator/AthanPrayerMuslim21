<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TowMes®™ Professional Athan System - M.A.M</title>
    <style>
        :root {
            --primary-red: #ff0000;
            --active-green: #8FBC8F;
            --dark-bg: #050505;
            --glass-bg: rgba(15, 15, 15, 0.95);
            --border-red: rgba(255, 0, 0, 0.45);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            background: radial-gradient(circle at 50% 50%, #1c2535 0%, #050505 100%);
            color: #ffffff; font-family: 'Segoe UI', Tahoma, sans-serif;
            display: flex; flex-direction: column; align-items: center; min-height: 100vh;
            overflow-x: hidden;
        }

        .marquee-box {
            width: 100%; background: rgba(255, 0, 0, 0.1);
            border-bottom: 1px solid var(--border-red);
            padding: 5px 0; font-size: 0.8rem; color: #fff;
        }

        .main-card {
            position: relative; z-index: 20; width: 92%; max-width: 420px;
            background: var(--glass-bg); backdrop-filter: blur(25px);
            border-radius: 40px; padding: 1.5rem; border: 2px solid var(--border-red);
            text-align: center; margin-top: 15px; box-shadow: 0 40px 100px rgba(0,0,0,0.9);
        }

        .brand-title {
            font-size: 1.0rem; font-weight: 800; color: var(--primary-red);
            letter-spacing: 1px; text-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
            margin-bottom: 2px;
        }

        .clock-container { margin-bottom: 15px; }
        .main-time {
            font-size: 2.2rem; font-weight: 900; color: #ffffff;
            font-variant-numeric: tabular-nums; line-height: 1;
        }
        
        .date-container {
            margin-top: 7px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .hijri-txt { color: var(--primary-red); font-size: 1rem; font-weight: bold; }
        .gregorian-txt { color: #aaa; font-size: 0.9rem; font-weight: 500; }

        .prayer-card {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 18px; background: rgba(255, 255, 255, 0.03);
            border-radius: 15px; margin-bottom: 8px; border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .prayer-card.active {
            background: rgba(255, 0, 0, 0.2); border-color: var(--primary-red);
            transform: scale(1.02);
        }

        .custom-select {
            width: 100%; padding: 12px; border-radius: 12px;
            background: #000; color: #fff; border: 1px solid var(--primary-red);
            font-size: 0.9rem; margin-bottom: 10px; outline: none;
        }

        .action-button {
            width: 100%; padding: 16px; border-radius: 20px; border: none;
            background: var(--primary-red);
            color: #fff; font-size: 1.1rem; font-weight: 900;
            cursor: pointer; transition: 0.4s;
            box-shadow: 0 10px 20px rgba(255, 0, 0, 0.3);
        }

        .btn-active {
            background: var(--active-green) !important;
            color: #000 !important;
            box-shadow: 0 10px 20px rgba(0, 255, 68, 0.3) !important;
        }

        .legal-mark { font-size: 0.75rem; color: rgba(255, 0, 0, 0.5); margin-top: 15px; font-weight: 900; }
        .kaaba-bg { position: fixed; bottom: 0; opacity: 0.1; width: 100%; z-index: 1; pointer-events: none; }
    </style>
</head>
<body onclick="startupSystem()">

    <div class="marquee-box">
        <marquee behavior="scroll" direction="right">نِدَاءُ الصٓلاة حَسبَ التوْقيتِ المَحلي 🌍 GMT - + 🌍</marquee>
    </div>

    <img src="https://pngimg.com/d/kaaba_PNG10.png" class="kaaba-bg">

    <div class="main-card">
        <h1 class="brand-title">TowMes™ - M.A.M</h1>
        
        <div class="clock-container">
            <div class="main-time" id="live-clock">00:00:00</div>
            <div class="date-container">
                <div id="hijri-display" class="hijri-txt">جاري المزامنة...</div>
                <div id="gregorian-display" class="gregorian-txt">-- / -- / ----</div>
            </div>
        </div>

        <select id="country-selector" class="custom-select" onchange="changeRegion()">
            <option value="AUTO">🛰️ تحْدِيد الموْقع الجُغرَافي تلقَائياً</option>
            <optgroup label=🏠"العرَب">
                <option value="MA">🇲🇦المَملكة المَغربية</option>
                <option value="SA">🇸🇦المَملكة العرَبية السعُودية</option>
                <option value="EG">🇪🇬جمْهورية مِصر العَربية</option>
                <option value="DZ">🇩🇿الجَزائر</option>
                <option value="AE">🇦🇪الإماَرات العَربية المُتحدة</option>
                <option value="QA">🇶🇦قَطر</option>
            </optgroup>
            <optgroup label=🏠"أرُوبا">
                <option value="FR">🇲🇫فرنسَا (بارِيس)</option>
                <option value="ES">🇪🇦إسبَانيا (مدْريد)</option>
                <option value="DE">🇩🇪ألْمانيا (برلِين)</option>
                <option value="GB">🇬🇧الممْلكة المتَحدة (لندُن)</option>
            </optgroup>
            <optgroup label=🏠"آسْيا">
                <option value="TR">🇹🇷ترْكيا</option>
                <option value="MY">🇲🇾مَاليزيا</option>
                <option value="ID">🇮🇩إندُونيسيا</option>
                <option value="JP">🇯🇵اليَابان (طُوكيو)</option>
            </optgroup>
            <optgroup label=🏠"أمرِيكا">
                <option value="US">🇺🇲الولَايات المتٓحدة (نيُويورك)</option>
                <option value="CA">🇨🇦كنَدا</option>
                <option value="BR">🇧🇷البَرازيل</option>
            </optgroup>
        </select>

        <select id="moazin-picker" class="custom-select" onchange="loadVoice()">
            <option value="https://www.islamcan.com/audio/adhan/azan1.mp3">الشيْخ عبْد الباسط عبْد الصمَد🔊</option>
            <option value="https://www.islamcan.com/audio/adhan/azan5.mp3">الشيْخ محَمد صدِيق المنْشاوي🔊</option>
            <option value="https://www.islamcan.com/audio/adhan/azan3.mp3">الشيْخ مشَاري راشِد العفٓاسي🔊</option>
            <option value="https://www.islamcan.com/audio/adhan/azan4.mp3">الشيْخ سعْد الغامِدي🔊</option>
            <option value="https://www.islamcan.com/audio/adhan/azan20.mp3">أذَان مَكة المُكرمة🔊</option>
            <option value="https://www.islamcan.com/audio/adhan/azan2.mp3">الشيْخ محمُود خَليل الحُصري🔊</option>
        </select>

        <div id="prayer-container" style="margin-bottom: 15px;"></div>

        <button class="action-button" id="master-btn">🔻تفْعيل نظامِ الأَذاَن</button>

        <div class="legal-mark">©™Developed by TowMes</div>
    </div>

    <script>
        let adhanAudio = new Audio();
        let isLive = false;
        let apiData = {};
        let lastTrigger = "";

        async function fetchTimings(lat = 34.02, lng = -6.83) {
            try {
                const res = await fetch(`https://api.aladhan.com/v1/timings?latitude=${lat}&longitude=${lng}&method=4`);
                const result = await res.json();
                apiData = result.data.timings;
                
                const h = result.data.date.hijri;
                document.getElementById('hijri-display').innerText = `${h.day} ${h.month.ar} ${h.year} هـ`;
                
                const g = result.data.date.gregorian;
                document.getElementById('gregorian-display').innerText = `${g.day} ${g.month.en} ${g.year} م`;
                
                renderPrayers();
            } catch(e) { console.error("Data fetch failed"); }
        }

        function renderPrayers() {
            const keys = { 'Fajr':'الفجْر', 'Dhuhr':'الظهْر', 'Asr':'العَصر', 'Maghrib':'المغرِب', 'Isha':'العِشاء' };
            const container = document.getElementById('prayer-container');
            container.innerHTML = '';
            Object.keys(keys).forEach(k => {
                container.innerHTML += `
                    <div class="prayer-card" id="card-${k}">
                        <span style="font-weight:900; color:var(--primary-red)">${keys[k]}</span>
                        <span style="font-family:monospace; font-weight:bold">${apiData[k]}</span>
                    </div>`;
            });
        }

        function loadVoice() {
            adhanAudio.src = document.getElementById('moazin-picker').value;
            adhanAudio.load();
        }

        function startupSystem() {
            if(!isLive) {
                loadVoice();
                adhanAudio.play().then(() => {
                    adhanAudio.pause();
                    isLive = true;
                    const btn = document.getElementById('master-btn');
                    btn.innerText = "النِظامُ نَشِط";
                    btn.classList.add('btn-active');
                });
            }
        }

        function changeRegion() {
            const val = document.getElementById('country-selector').value;
            const coords = { 
                'MA':[34.02, -6.83], 'SA':[24.71, 46.67], 'EG':[30.04, 31.23], 'DZ':[36.75, 3.06], 
                'AE':[24.45, 54.37], 'QA':[25.28, 51.53], 'FR':[48.85, 2.35], 'ES':[40.41, -3.70], 
                'DE':[52.52, 13.40], 'GB':[51.50, -0.12], 'TR':[39.93, 32.85], 'MY':[3.13, 101.68], 
                'ID':[-6.20, 106.84], 'JP':[35.67, 139.65], 'US':[40.71, -74.00], 'CA':[45.42, -75.69], 'BR':[-15.79, -47.88]
            };
            if(val === "AUTO") {
                navigator.geolocation.getCurrentPosition(p => fetchTimings(p.coords.latitude, p.coords.longitude));
            } else if(coords[val]) { 
                fetchTimings(coords[val][0], coords[val][1]); 
            }
        }

        setInterval(() => {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            const currentStr = `${h}:${m}`;
            document.getElementById('live-clock').innerText = `${h}:${m}:${s}`;

            if(apiData) {
                ['Fajr', 'Dhuhr', 'Asr', 'Maghrib', 'Isha'].forEach(p => {
                    if(apiData[p] === currentStr) {
                        document.getElementById(`card-${p}`).classList.add('active');
                        if(isLive && lastTrigger !== p) {
                            adhanAudio.play();
                            lastTrigger = p;
                        }
                    } else {
                        if(document.getElementById(`card-${p}`)) 
                            document.getElementById(`card-${p}`).classList.remove('active');
                    }
                });
            }
        }, 1000);

        window.onload = () => fetchTimings();
    </script>
<style>
    /* التوازن البصري: تمييز الزر عند الوقوف عليه بالريموت */
    :focus {
        outline: 8px solid #00bfff !important; /* إطار أزرق Azraq2 */
        background-color: rgba(0, 191, 255, 0.3) !important;
        box-shadow: 0 0 20px #00bfff !important;
        transform: scale(1.05);
    }
</style>
</script>
</body>
</html>
